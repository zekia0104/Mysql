[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysql-migration-guard"
version = "0.2.0"
description = "Review MySQL migration SQL and find the statements that will lock your production tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zekia0104" }]
keywords = [
  "mysql",
  "migration",
  "ddl",
  "schema",
  "database",
  "linter",
  "static-analysis",
  "ci",
  "devops",
  "zero-dependencies",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.scripts]
migration-guard = "migration_guard.cli:main"

[project.urls]
Homepage = "https://github.com/zekia0104/Mysql"
Repository = "https://github.com/zekia0104/Mysql"
Issues = "https://github.com/zekia0104/Mysql/issues"
Changelog = "https://github.com/zekia0104/Mysql/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zekia0104/Mysql#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
